{% extends "base.html" %}

{% block title %}Income and Expenses - MyBudgetTrackr{% endblock %}

{% block content %}
  <div class="add-income-expenses">
    <h1>Add Income</h1>
    <form action="/add_income" method="post" class="form-group">
        <label for="income">Amount: </label>
        <input type="number" id="income" name="income" required>
        <label for="income_date">Date: </label>
        <input type="date" id="income_date" name="income_date" required>
        <button type="submit">Add Income</button>
    </form>
    <h1>Add Expense</h1>
    <form action="/add_expense" method="post" class="form-group">
        <label for="category">Category:</label>
        <input type="text" id="category" name="category" required>
        <label for="expense">Amount:</label>
        <input type="number" id="expense" name="expense" required>
        <label for="expense_date">Date:</label>
        <input type="date" id="expense_date" name="expense_date" required>
        <button type="submit">Add Expense</button>
    </form>

    <form action="/savings_goal" method="post" class="form-group">
        <h1>Set Savings Goal</h1>
        <label for="savings_goal">Savings Goal</label>
        <input type="number" name="savings_goal" id="savings_goal" required>
        <button type="submit">Set Savings Goal</button>
    </form>    

    <h1>Recurring expenses</h1>
    <form action = "/recurring_expenses" method = "post" class="form-group">
        <label for="category">Category</label>
        <input type="text" name="category" id="category" required>
        <label for="amount">Amount</label>
        <input type="number" name="amount" id="amount" required>
        <label for="frequency">Frequency</label>
        <select name="frequency" id="frequency">
            <option value="monthly">Monthly</option>
            <option value="weekly">Weekly</option>
        </select>
        <button type="submit">Add recurring expense</button>
    </form>
    <footer>
        <p>&copy; 2024 MyBudgetTrackr. All rights reserved. (Not Really)</p>
    </footer>
{% endblock %}
